services:
  - type: web
    name: fse-terabox
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    envVars:
      - key: TERABOX_CLIENT_ID
        sync: false
      - key: TERABOX_CLIENT_SECRET
        sync: false
      - key: TERABOX_PRIVATE_SECRET
        sync: false
