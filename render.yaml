services:
  - type: web
    name: fse-terabox
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FSE_MASTER_KEY
        sync: false
      - key: TERABOX_CLIENT_ID
        sync: false
      - key: TERABOX_CLIENT_SECRET
        sync: false
      - key: TERABOX_PRIVATE_SECRET
        sync: false
      - key: TERABOX_ACCESS_TOKEN
        sync: false
      - key: TERABOX_REFRESH_TOKEN
        sync: false
      - key: TERABOX_APP_FOLDER
        value: FSE-Storage
      - key: CHUNK_SIZE
        value: '8388608'
      - key: BACKUP_INTERVAL_SECONDS
        value: '600'
      - key: DATABASE_URL
        value: sqlite:///./data/fse.db
