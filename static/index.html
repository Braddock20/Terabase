<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FSE — TeraBox Storage</title><style>
:root{--bg:#08090b;--panel:#111317;--panel2:#17191e;--text:#f5f7fa;--muted:#8e96a3;--line:#252a33;--accent:#7c5cff;--good:#42d392;--bad:#ff647c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17122b,transparent 35%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white;cursor:pointer;font-weight:650}button.secondary{background:var(--panel2);border:1px solid var(--line)}button.danger{background:#3a151d;color:#ff9aaa}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 14px;background:#0b0c0f}.brand{font-size:19px;font-weight:800;padding:8px 10px 25px}.brand span{color:#8d74ff}.nav{display:grid;gap:6px}.nav button{background:transparent;color:#aeb5c0;text-align:left}.nav button.active,.nav button:hover{background:#171522;color:white}.main{padding:28px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:26px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,#14161b,#101216);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-size:27px;font-weight:800;margin-top:8px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 12px}.bar{height:8px;background:#222631;border-radius:20px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#42d392);width:0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.file{display:flex;align-items:center;gap:12px;min-width:0}.icon{width:40px;height:40px;border-radius:11px;background:#1d192d;display:grid;place-items:center;color:#a893ff;font-weight:800}.name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{font-size:11px;padding:4px 8px;border-radius:20px;background:#14291f;color:#68e1a5}.empty{padding:45px;text-align:center;color:var(--muted)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#111317;border:1px solid var(--line);border-radius:20px;padding:28px}.loginbox h1{margin-top:0}.loginbox input{width:100%;background:#090a0d;border:1px solid var(--line);color:white;padding:13px;border-radius:10px;margin:10px 0 14px}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:20px}.modal.show{display:grid}.modalbox{width:min(520px,100%);background:#121419;border:1px solid var(--line);border-radius:18px;padding:22px}.qr{display:grid;place-items:center;margin:15px}.qr img{max-width:260px;max-height:260px;background:white;padding:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.drop{border:1px dashed #3b4050;border-radius:14px;padding:35px;text-align:center;background:#0e1014}.drop.drag{border-color:var(--accent);background:#171327}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="root"></div><div class="modal" id="modal"><div class="modalbox"><div class="top"><h2 id="modalTitle">TeraBox</h2><button class="secondary" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div><script>
const $=s=>document.querySelector(s);const api=async(u,o={})=>{let r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'Request failed');return j};
async function boot(){let m=await api('/api/me');if(!m.authenticated)return login();app()}function login(){$('#root').innerHTML=`<div class="login"><div class="loginbox"><h1>FSE <span style="color:#8d74ff">Storage</span></h1><p class="muted">TeraBox-first · encrypted storage</p><p class="muted">Get the admin key from Render Shell with: <code>python -m app.admin</code></p><input id="pw" type="password" placeholder="Storage admin key"><button style="width:100%" onclick="doLogin()">Sign in</button></div></div>`}async function doLogin(){try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});app()}catch(e){alert(e.message)}}
function app(){document.title='FSE — TeraBox Storage';$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand">FSE <span>Storage</span></div><div class="nav"><button class="active">Overview</button><button onclick="loadFiles()">Files</button><button onclick="openTB()">TeraBox</button><button onclick="openSettings()">Settings</button><button onclick="logout()">Sign out</button></div></aside><main class="main"><div class="top"><div><h1>Storage overview</h1><div class="muted">Encrypted, chunked and managed through one namespace.</div></div><div class="actions"><button class="secondary" onclick="refresh()">Refresh</button><button onclick="$('#file').click()">Upload</button><input id="file" type="file" hidden onchange="upload(this.files[0])"></div></div><div class="grid" id="metrics"></div><div class="section card"><h2>TeraBox capacity</h2><div id="tbcap" class="muted">Loading…</div><div class="bar"><i id="bar"></i></div></div><div class="section card"><div class="top"><h2>Files</h2><button class="secondary" onclick="loadFiles()">Open files</button></div><div id="files"></div></div></main></div>`;refresh()}
async function refresh(){try{let [s,f]=await Promise.all([api('/api/terabox/status'),api('/api/files?limit=8')]);let used=f.items.reduce((a,x)=>a+x.size,0);$('#metrics').innerHTML=`<div class="card"><div class="muted">Logical files</div><div class="metric">${f.items.length}${f.items.length===8?'+':''}</div></div><div class="card"><div class="muted">Logical data</div><div class="metric">${fmt(used)}</div></div><div class="card"><div class="muted">Provider</div><div class="metric" style="font-size:20px">${s.connected?'TeraBox':'Offline'}</div></div><div class="card"><div class="muted">Security</div><div class="metric" style="font-size:20px">AES-256-GCM</div></div>`;if(s.connected&&s.quota){let pct=s.used/s.quota*100;$('#tbcap').innerHTML=`${fmt(s.used)} used of ${fmt(s.quota)} · ${Math.max(0,100-pct).toFixed(1)}% free` ;$('#bar').style.width=Math.min(100,pct)+'%'}else{$('#tbcap').innerHTML='<span style="color:#ffb45e">TeraBox not connected.</span> <button onclick="openTB()">Connect</button>'}renderFiles(f.items)}catch(e){alert(e.message)}}
function renderFiles(items){$('#files').innerHTML=items.length?items.map(f=>`<div class="row"><div class="file"><div class="icon">${ext(f.name)}</div><div style="min-width:0"><div class="name">${esc(f.name)}</div><div class="muted">${fmt(f.size)} · ${new Date(f.updated*1000).toLocaleString()}</div></div></div><div class="actions"><span class="pill">${f.status}</span><button class="secondary" onclick="download('${f.id}')">Download</button><button class="danger" onclick="removeFile('${f.id}')">Delete</button></div></div>`).join(''):'<div class="empty">No files yet. Upload something to begin.</div>'}
async function loadFiles(){let j=await api('/api/files?limit=100');openModal('Files',`<div class="drop" onclick="$('#file2').click()">Upload files<input id="file2" type="file" hidden multiple></div><div id="allfiles"></div>`);$('#file2').onchange=()=>[...$('#file2').files].forEach(upload);$('#allfiles').innerHTML=j.items.map(f=>`<div class="row"><div><b>${esc(f.name)}</b><div class="muted">${fmt(f.size)}</div></div><div class="actions"><button onclick="download('${f.id}')">Download</button><button class="danger" onclick="removeFile('${f.id}')">Delete</button></div></div>`).join('')||'<div class="empty">Empty</div>'}
async function upload(file){if(!file)return;try{let fd=new FormData();fd.append('file',file);let r=await fetch('/api/files',{method:'POST',body:fd});let j=await r.json();if(!r.ok)throw Error(j.detail||'Upload failed');await refresh();}catch(e){alert(e.message)}}async function download(id){location.href='/api/files/'+id+'/download'}async function removeFile(id){if(!confirm('Delete this file permanently?'))return;try{await api('/api/files/'+id,{method:'DELETE'});refresh();loadFiles()}catch(e){alert(e.message)}}
async function openTB(){let s=await api('/api/terabox/status');openModal('TeraBox connection',`<p class="muted">Use the official TeraBox Open Platform authorization flow. The engine stores the resulting tokens encrypted in its catalog.</p><div class="actions"><button onclick="startDevice()">Authorize with QR</button></div><div id="tbinfo" style="margin-top:18px">${s.connected?`<span class="pill">Connected</span><p class="muted">${s.api_domain||''}</p>`:'Not connected'}</div>`)}
async function startDevice(){try{let j=await api('/api/terabox/device/start',{method:'POST'});let qr=j.qr_code;let src=qr&&qr.startsWith('data:')?qr:'data:image/png;base64,'+qr;$('#modalBody').innerHTML=`<p>Scan this QR code with TeraBox.</p><div class="qr"><img src="${src}"></div><p class="muted">Waiting for authorization…</p>`;let n=0;let timer=setInterval(async()=>{try{let r=await api('/api/terabox/device/poll',{method:'POST'});if(r.authorized){clearInterval(timer);closeModal();refresh();}else if(++n>120)clearInterval(timer)}catch(e){}},5000)}catch(e){alert(e.message)}}
function openSettings(){openModal('Settings',`<div class="card"><b>Architecture</b><p class="muted">TeraBox-first · AES-256-GCM · 8 MiB logical chunks · encrypted catalog backup · resumable provider-level chunk placement.</p></div><div class="card" style="margin-top:10px"><b>Security</b><p class="muted">Provider never receives plaintext. Credentials and catalog secrets remain outside the provider namespace except encrypted backup data.</p></div>`)}
function openModal(t,b){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}async function logout(){await api('/api/logout',{method:'POST'});location.reload()}function fmt(n){if(!n)return'0 B';let u=['B','KB','MB','GB','TB'];let i=Math.floor(Math.log(n)/Math.log(1024));return(n/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]}function ext(n){let x=n.split('.').pop().slice(0,4).toUpperCase();return x||'FILE'}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}boot();
</script></body></html>
